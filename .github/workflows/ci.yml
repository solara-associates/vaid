# Conformance gate: the 8/8 conformance + byte-identical cross-language checks are
# the product claim, so we run them continuously on every push/PR to main.
# All actions are pinned to full commit SHAs (trailing tag comment for readability).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    name: Rust conformance (cargo test --workspace)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust toolchain (pinned to rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: "1.88"
      - name: cargo test --workspace --locked
        run: cargo test --workspace --locked

  python:
    name: Python conformance (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: Install vaid-pop + vaid-mint + vaid-langchain + test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install "./python/vaid-pop[test]"
          python -m pip install "./python/vaid-mint[test]"
          python -m pip install "./python/vaid-langchain[test]"
      - name: pytest conformance suite (vaid-pop + vaid-mint + vaid-langchain)
        run: python -m pytest python/vaid-pop python/vaid-mint python/vaid-langchain

  typescript:
    name: TypeScript conformance (node --test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"
      - name: Install workspace (vaid-pop + vaid-mint + vaid-client)
        run: npm ci --prefix typescript
      - name: Build in dependency order (vaid-pop -> vaid-mint -> vaid-client)
        run: npm run build --prefix typescript
      - name: node --test conformance suite (vaid-pop + vaid-mint + vaid-client)
        run: npm test --prefix typescript

  release-map:
    name: Every publishable package is reachable by the release workflow
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"
      # A package with no release-map.json entry cannot be released except by hand
      # — which is how vaid-skill 0.1.0, 0.1.1 and 0.1.2 went out unsigned. The
      # workflow refuses such a tag correctly, but that refusal arrives after a
      # version bump, a changelog and a tag. This moves it into the PR.
      - name: Verify the release map covers the tree
        run: node scripts/verify-release-map.mjs

  skill:
    name: Agent Skill (vaid-skill) — unit, acceptance, anchor parity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"
      # The skill wraps the PUBLISHED packages rather than this repo's sources, on
      # purpose: it must break when what users actually install breaks, not when
      # main moves. So this installs from the registry and does NOT use the
      # workspace build above.
      - name: Install from the registry (not from this checkout)
        run: npm install --prefix skill
      # The vendored trust anchor must be byte-identical to docs/kernel-keys.json,
      # and every key in it must hash to the thumbprint it is filed under. A stale
      # anchor does not degrade verification — it makes `vaid verify` accept
      # documents signed by whoever holds the key it still lists.
      - name: Trust-anchor parity with docs/kernel-keys.json
        run: node skill/scripts/check-anchor.mjs
      - name: Unit tests (with negative controls)
        run: npm test --prefix skill
      # Crosses process boundaries deliberately: the claim is that one program's
      # VAID can be checked by another that shares no memory with it.
      - name: End-to-end acceptance
        run: bash skill/test/acceptance.sh

  conformance-drift:
    name: PoP conformance drift-check (Rust == Python == TypeScript == vector, byte-identical)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # (a) The two vendored copies of the canonical vector MUST be byte-identical.
      # Each language test above only checks its OWN vendored copy; without this
      # cross-language cmp, drift between the Rust-side and Python-side vector goes
      # undetected. cmp exits non-zero (fails the job) on ANY byte difference.
      - name: Cross-language vector byte-identity (cmp)
        run: |
          cmp \
            crates/vaid-client/tests/vectors/operator_pop_v1.json \
            crates/vaid-pop/tests/vectors/operator_pop_v1.json
          cmp \
            crates/vaid-client/tests/vectors/operator_pop_v1.json \
            python/vaid-pop/vaid_pop/vectors/operator_pop_v1.json
          cmp \
            crates/vaid-client/tests/vectors/operator_pop_v1.json \
            typescript/vaid-pop/vectors/operator_pop_v1.json
          cmp \
            crates/vaid-client/tests/vectors/operator_pop_v1.json \
            typescript/vaid-client/vectors/operator_pop_v1.json
      # (b) Re-run BOTH conformance suites against their vendored vectors so this
      # single job proves: Rust output == vector AND Python output == vector, and
      # (via the cmp above) the two vectors are the same bytes ⇒ Rust == Python.
      - name: Install Rust toolchain (pinned to rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: "1.88"
      - name: Rust conformance gate (cargo test -p vaid-client --test conformance)
        run: cargo test -p vaid-client --test conformance --locked
      # The PACKAGED Rust firewall, the same executable a consumer gets from
      # `cargo install vaid-pop`. The test gate above proves the source conforms;
      # this proves the shipped binary does, which is the claim the site makes.
      - name: Rust conformance gate (packaged firewall)
        run: cargo run -p vaid-pop --bin vaid-pop-conformance --locked
      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: Install vaid-pop + test deps
        run: python -m pip install --upgrade pip && python -m pip install "./python/vaid-pop[test]"
      - name: Python conformance gate (pytest)
        run: python -m pytest python/vaid-pop/tests/test_conformance.py
      - name: Set up Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"
      - name: Install + build TypeScript workspace
        run: npm ci --prefix typescript && npm run build --prefix typescript
      - name: TypeScript conformance gate (packaged firewall)
        run: node typescript/vaid-pop/dist/bin/conformance.js

  mint-conformance-drift:
    name: Mint conformance drift-check (Rust == Python == TypeScript == vector, byte-identical)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # (a) The two vendored copies of the mint vector MUST be byte-identical.
      - name: Cross-language mint-vector byte-identity (cmp)
        run: |
          cmp \
            crates/vaid-mint/tests/vectors/mint_v1.json \
            python/vaid-mint/vaid_mint/vectors/mint_v1.json
          cmp \
            crates/vaid-mint/tests/vectors/mint_v1.json \
            typescript/vaid-mint/vectors/mint_v1.json
      # (b) Re-run BOTH mint conformance gates against their vendored vectors:
      # Rust output == vector AND Python output == vector, and (via cmp) the two
      # vectors are the same bytes ⇒ Rust == Python. Self-consistent within this
      # repo (Decision B), not conformant against the closed VAID format.
      - name: Install Rust toolchain (pinned to rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: "1.88"
      - name: Rust mint conformance gate (cargo test -p vaid-mint --test mint_conformance)
        run: cargo test -p vaid-mint --test mint_conformance --locked
      # The PACKAGED firewall, not the test gate. Different audiences: the test
      # needs a checkout, this is what a `cargo install vaid-mint` consumer runs.
      # It also enumerates the embedded vectors and fails closed on any it cannot
      # account for, in either direction.
      - name: Rust mint conformance gate (packaged firewall)
        run: cargo run -p vaid-mint --bin vaid-mint-conformance --locked
      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: Install vaid-pop + vaid-mint + test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install "./python/vaid-pop[test]"
          python -m pip install "./python/vaid-mint[test]"
      - name: Python mint conformance gate (pytest)
        run: python -m pytest python/vaid-mint/tests/test_mint_conformance.py
      - name: Set up Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"
      - name: Install + build TypeScript workspace
        run: npm ci --prefix typescript && npm run build --prefix typescript
      - name: TypeScript mint conformance gate (packaged firewall)
        run: node typescript/vaid-mint/dist/bin/conformance.js

  chain-conformance-drift:
    name: Chain-presentation drift-check (Rust == Python == TypeScript == vector, byte-identical)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # (a) All three vendored copies of the chain vector MUST be identical.
      # ADR-0003 §3: this vector is ADDITIVE. It introduces no new signed field and
      # does NOT re-freeze mint_v1 or mint_pop_v1 — every document inside it is an
      # ordinary v3 VAID over the existing canonicalization. What it pins that no
      # other vector does is the WALK: the assembled lineage order and the
      # verification verdict. Two implementations can agree on every digest and
      # still disagree there, which is exactly the gap this closes.
      - name: Cross-language chain-vector byte-identity (cmp)
        run: |
          cmp \
            crates/vaid-mint/tests/vectors/chain_v1.json \
            python/vaid-mint/vaid_mint/vectors/chain_v1.json
          cmp \
            crates/vaid-mint/tests/vectors/chain_v1.json \
            typescript/vaid-mint/vectors/chain_v1.json
      # (b) Re-run all three gates against their vendored copies ⇒ each language's
      # walk == vector, and (via cmp) the vectors are the same bytes ⇒ all three
      # implementations assemble and adjudicate identically.
      - name: Install Rust toolchain (pinned to rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: "1.88"
      - name: Rust chain conformance gate (cargo test -p vaid-mint --test chain_conformance)
        run: cargo test -p vaid-mint --test chain_conformance --locked
      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: Install vaid-pop + vaid-mint + test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install "./python/vaid-pop[test]"
          python -m pip install "./python/vaid-mint[test]"
      - name: Python chain conformance gate (pytest)
        run: python -m pytest python/vaid-mint/tests/test_chain_conformance.py
      - name: Set up Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"
      - name: Install + build TypeScript workspace
        run: npm ci --prefix typescript && npm run build --prefix typescript
      - name: TypeScript chain conformance gate (node --test)
        run: npm test --prefix typescript/vaid-mint

  attestation-conformance-drift:
    name: Consent-attestation drift-check (Rust == Python == TypeScript == vector, byte-identical)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # (a) All three vendored copies of the attestation vector MUST be identical.
      # ADDITIVE: the consent attestation is a SEPARATE SIGNED OBJECT, not a VAID
      # document field, so freezing it re-freezes nothing — mint_v1, mint_pop_v1 and
      # chain_v1 are untouched and sig_version is unchanged. `att_version` is this
      # object's own discriminant.
      - name: Cross-language attestation-vector byte-identity (cmp)
        run: |
          cmp \
            crates/vaid-mint/tests/vectors/attestation_v1.json \
            python/vaid-mint/vaid_mint/vectors/attestation_v1.json
          cmp \
            crates/vaid-mint/tests/vectors/attestation_v1.json \
            typescript/vaid-mint/vectors/attestation_v1.json
      # ADR-0005 / spec S.3. Same cmp discipline, and needed for the same reason even
      # though this vector pins no bytes of its own: what must agree across languages
      # is the VERDICT on every case, and three copies of the case table are three
      # chances for one of them to drift. The matcher went un-vectored until 0.5.0,
      # which is precisely how bare prefix matching survived in all three
      # implementations at once — they agreed with each other and with nothing else.
      # ADR-0006. Same cmp discipline: this vector pins VERDICTS rather than bytes,
      # and three copies of the case table are three chances for one to drift.
      - name: Cross-language roundtrip-vector byte-identity (cmp)
        run: |
          cmp \
            crates/vaid-mint/tests/vectors/roundtrip_v1.json \
            python/vaid-mint/vaid_mint/vectors/roundtrip_v1.json
          cmp \
            crates/vaid-mint/tests/vectors/roundtrip_v1.json \
            typescript/vaid-mint/vectors/roundtrip_v1.json
      - name: Cross-language scope-vector byte-identity (cmp)
        run: |
          cmp \
            crates/vaid-mint/tests/vectors/scope_v1.json \
            python/vaid-mint/vaid_mint/vectors/scope_v1.json
          cmp \
            crates/vaid-mint/tests/vectors/scope_v1.json \
            typescript/vaid-mint/vectors/scope_v1.json
      # (b) Re-run all three gates against their vendored copies ⇒ each language's
      # canonicalization and signature == vector, and (via cmp) the vectors are the
      # same bytes ⇒ all three agree.
      - name: Install Rust toolchain (pinned to rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: "1.88"
      - name: Rust attestation conformance gate
        run: cargo test -p vaid-mint --test attestation_conformance --locked
      - name: Rust scope conformance gate (ADR-0005)
        run: cargo test -p vaid-mint --test scope_conformance --locked
      - name: Rust roundtrip conformance gate (ADR-0006)
        run: cargo test -p vaid-mint --test roundtrip_conformance --locked
      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: Install vaid-pop + vaid-mint + test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install "./python/vaid-pop[test]"
          python -m pip install "./python/vaid-mint[test]"
      - name: Python attestation conformance gate (pytest)
        run: python -m pytest python/vaid-mint/tests/test_attestation_conformance.py
      - name: Python scope conformance gate (ADR-0005)
        run: python -m pytest python/vaid-mint/tests/test_scope_conformance.py
      - name: Python roundtrip conformance gate (ADR-0006)
        run: python -m pytest python/vaid-mint/tests/test_roundtrip_conformance.py
      - name: Set up Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"
      - name: Install + build TypeScript workspace
        run: npm ci --prefix typescript && npm run build --prefix typescript
      - name: TypeScript attestation conformance gate (node --test)
        run: npm test --prefix typescript/vaid-mint

  mint-pop-conformance-drift:
    name: Mint-PoP drift-check (Rust == Python == TypeScript == vector, byte-identical)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # (a) All three vendored copies of the mint-PoP vector MUST be identical.
      # This vector pins `MintPopPayload` — until it was frozen, that was the one
      # SIGNED structure with no artifact holding the implementations to it
      # (docs/spec/encoding.md E.11), and it is the only vector carrying a JSON
      # null (E.7).
      - name: Cross-language mint-PoP-vector byte-identity (cmp)
        run: |
          cmp \
            crates/vaid-mint/tests/vectors/mint_pop_v1.json \
            python/vaid-mint/vaid_mint/vectors/mint_pop_v1.json
          cmp \
            crates/vaid-mint/tests/vectors/mint_pop_v1.json \
            typescript/vaid-mint/vectors/mint_pop_v1.json
      # (b) Re-run all three gates against their vendored copies ⇒ each language's
      # output == vector, and (via cmp) the copies are the same bytes.
      - name: Install Rust toolchain (pinned to rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: "1.88"
      - name: Rust mint-PoP conformance gate (cargo test -p vaid-mint --test mint_pop_conformance)
        run: cargo test -p vaid-mint --test mint_pop_conformance --locked
      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: Install vaid-pop + vaid-mint + test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install "./python/vaid-pop[test]"
          python -m pip install "./python/vaid-mint[test]"
      - name: Python mint-PoP conformance gate (pytest)
        run: python -m pytest python/vaid-mint/tests/test_mint_pop_conformance.py
      - name: Set up Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"
      - name: Install + build TypeScript workspace
        run: npm ci --prefix typescript && npm run build --prefix typescript
      # The packaged vaid-mint firewall checks both the document and the mint-PoP
      # vector.
      - name: TypeScript mint-PoP conformance gate (packaged firewall)
        run: node typescript/vaid-mint/dist/bin/conformance.js

  pathquery-conformance-drift:
    name: Path-with-query drift-check (Rust == Python == TypeScript == vector, byte-identical)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # (a) The two vendored copies of the path-with-query vector MUST be identical.
      - name: Cross-language pathquery-vector byte-identity (cmp)
        run: |
          cmp \
            crates/vaid-client/tests/vectors/pathquery_v1.json \
            python/vaid-langchain/vaid_langchain/vectors/pathquery_v1.json
          cmp \
            crates/vaid-client/tests/vectors/pathquery_v1.json \
            typescript/vaid-client/vectors/pathquery_v1.json
      # (b) Re-run BOTH gates against their vendored copies ⇒ Rust == Python ==
      # vector for the pinned path+query signing convention.
      - name: Install Rust toolchain (pinned to rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: "1.88"
      - name: Rust pathquery conformance gate (cargo test -p vaid-client --test pathquery_conformance)
        run: cargo test -p vaid-client --test pathquery_conformance --locked
      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: Install vaid-pop + vaid-langchain + test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install "./python/vaid-pop[test]"
          python -m pip install "./python/vaid-langchain[test]"
      - name: Python pathquery conformance gate (pytest)
        run: python -m pytest python/vaid-langchain/tests/test_path_convention.py
      - name: Set up Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"
      - name: Install + build TypeScript workspace
        run: npm ci --prefix typescript && npm run build --prefix typescript
      - name: TypeScript pathquery conformance gate (packaged firewall)
        run: node typescript/vaid-client/dist/bin/conformance.js

  completion-conformance-drift:
    name: Completion-record drift-check (Rust == Python == TypeScript == vector, byte-identical)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # (a) The two vendored copies of the completion vector MUST be identical.
      - name: Cross-language completion-vector byte-identity (cmp)
        run: |
          cmp \
            crates/vaid-pop/tests/vectors/completion_v1.json \
            python/vaid-pop/vaid_pop/vectors/completion_v1.json
          cmp \
            crates/vaid-pop/tests/vectors/completion_v1.json \
            typescript/vaid-pop/vectors/completion_v1.json
      # (b) Re-run BOTH gates ⇒ Rust == Python == vector for the completion record,
      # including the AssuranceTier enum-string drift guard (first vector w/ enum).
      - name: Install Rust toolchain (pinned to rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: "1.88"
      - name: Rust completion conformance gate (cargo test -p vaid-pop --test completion_conformance)
        run: cargo test -p vaid-pop --test completion_conformance --locked
      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: Install vaid-pop + test deps
        run: python -m pip install --upgrade pip && python -m pip install "./python/vaid-pop[test]"
      - name: Python completion conformance gate (pytest)
        run: python -m pytest python/vaid-pop/tests/test_completion_conformance.py
      - name: Set up Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"
      - name: Install + build TypeScript workspace
        run: npm ci --prefix typescript && npm run build --prefix typescript
      # The packaged vaid-pop firewall covers the completion record, including the
      # AssuranceTier enum-string drift guard.
      - name: TypeScript completion conformance gate (packaged firewall)
        run: node typescript/vaid-pop/dist/bin/conformance.js

  capabilities:
    name: Capabilities manifest & claims-register verified
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # verify-vector-freeze.mjs compares each vector against the release TAG
          # for its current version, so tags and history must be present. The
          # default shallow, tagless checkout would make it fail closed.
          fetch-depth: 0
      # node is preinstalled on ubuntu-latest; the checks use only built-ins + fetch.
      - name: Verify docs/capabilities.json matches reality (registries + blocker PR state)
        run: node scripts/verify-capabilities.mjs
      - name: Verify docs/claims-register.json freshness (age budget + backing)
        run: node scripts/verify-claims.mjs
      # Local, no network: every package must agree WITH ITSELF (manifest vs code
      # constant vs changelog). Runs BEFORE the registry check — a package that
      # contradicts itself makes the registry answer meaningless.
      - name: Verify each package agrees with itself (internal version agreement)
        run: node scripts/verify-internal-versions.mjs
      - name: Verify in-repo package versions are published (registry parity)
        run: node scripts/verify-package-versions.mjs
      # The only check here that compares the frozen WIRE CONTRACT to the version
      # it shipped under, rather than comparing declarations to each other. Closes
      # the hole that let VAID v3 sit in crates/vaid-mint under an unchanged
      # 0.2.0: Rust has no second declaration to disagree with its manifest, so
      # every declaration-based check passed. See the script header.
      - name: Verify frozen vectors have not moved under a released version
        run: node scripts/verify-vector-freeze.mjs
      # ADVISORY, never fails. Every check above compares a package to ITSELF, to
      # its OWN registry, or to its OWN release tag — none can see two languages
      # disagreeing about the same package name, which is how vaid-pop came to sit
      # at 0.2.1/0.2.0/0.3.0 across crates.io/PyPI/npm with everything green.
      # Independent versioning is stated policy, so skew is legitimate and this
      # REPORTS rather than blocks; making it fatal would forbid the deliberate
      # single-language releases the policy exists to allow. Read the output as a
      # question ("is this still the intended skew?"), not a defect.
      - name: Report cross-language version skew (advisory, never fails)
        run: node scripts/verify-crosslang-parity.mjs
