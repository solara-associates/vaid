# Synthera VAID — open standard layer (Apache-2.0).
# Fresh workspace. Members are EXACTLY the two open crates: the proof-of-possession
# signing primitive and the reference Rust client SDK built on it. No non-public
# crate is a member, and no dependency resolves to one.
[workspace]
resolver = "2"
members = [
    "crates/vaid-pop",
    "crates/vaid-client",
    "crates/vaid-mint",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["solara.associates"]

# Dependency versions the two crates inherit via `{ workspace = true }`.
# `vaid-pop` resolves to the LOCAL path in THIS repo.
#
# THE `version` HERE IS THE FLOOR A CONSUMER GETS, and it is the one field in this
# file the repo is structurally blind to. In-tree, `path` wins and the floor is
# never exercised; from a registry, `path` is stripped and `version` is all that
# survives. So a stale floor is invisible to every test in this repository and
# visible to every consumer.
#
# It has bitten twice. Published `vaid-client` 0.1.0 (13 July) carries
# `vaid-pop = "0.1.0"` — correct when it shipped, three vaid-pop releases stale by
# 2026-08-07 — so a fresh `cargo add vaid-client` still resolves vaid-pop 0.1.0,
# without the packaged `vaid-pop-conformance` firewall (0.2.0) or the vector
# enumeration (0.2.1). Separately, python `vaid-mint` 0.3.0 declared
# `vaid-pop>=0.1.0` while its console script imported a 0.2.0 symbol.
#
# Raised to 0.2.1 (latest published) on 2026-08-07. NOT released for — the next
# release of either dependent crate carries it. Bump this whenever vaid-pop
# publishes, not when a dependent happens to need it.
[workspace.dependencies]
vaid-pop = { path = "crates/vaid-pop", version = "0.2.1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ring = "0.17"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
async-trait = "0.1"
thiserror = "2"
base64 = "0.22"
tokio = { version = "1", features = ["full"] }
