[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vaid-adk"
version = "0.1.0"
description = "VAID verification for Google ADK: a BasePlugin that checks a presented VAID's signature, expiry, delegation-chain attenuation and revocation before an agent runs, is delegated to, or calls a tool, denying fail-closed."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    # Two entries by design: PEP 621 routes any entry that has an email
    # entirely into Author-email, leaving the core Author field empty (PyPI
    # then renders "Author: None"). The name-only entry populates Author;
    # the second preserves the existing Author-email verbatim.
    { name = "solara.associates" },
    { name = "solara.associates", email = "info@solara.associates" },
]
keywords = ["vaid", "adk", "agent-identity", "delegation", "attenuation", "google-adk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
# vaid-mint = the signature/chain/attenuation/revocation primitives this
# plugin calls; it reimplements none of them. google-adk is pinned to the
# major verified against (2.x; tested at 2.11.0) — BasePlugin.before_agent_
# callback / before_tool_callback are the extension points this package
# relies on; a future ADK major is a deliberate re-verification, not a silent
# version-range upgrade.
dependencies = [
    "vaid-mint>=0.9.0,<0.10",
    "google-adk>=2.0,<3",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.urls]
Homepage = "https://github.com/solara-associates/vaid"
Repository = "https://github.com/solara-associates/vaid"
Source = "https://github.com/solara-associates/vaid/tree/main/python/vaid-adk"
Issues = "https://github.com/solara-associates/vaid/issues"

[tool.hatch.build.targets.wheel]
packages = ["vaid_adk"]

[tool.hatch.build.targets.sdist]
include = ["vaid_adk", "tests", "examples", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
