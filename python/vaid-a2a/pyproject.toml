[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vaid-a2a"
version = "0.2.0"
description = "Reference verifier for the VAID A2A extension (docs/a2a/v1/extension.md): checks a VAID carried in an A2A Message against signature, expiry, chain attenuation, requested-action scope and revocation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    # Two entries by design: PEP 621 routes any entry that has an email
    # entirely into Author-email, leaving the core Author field empty (PyPI
    # then renders "Author: None"). The name-only entry populates Author;
    # the second preserves the existing Author-email verbatim.
    { name = "solara.associates" },
    { name = "solara.associates", email = "info@solara.associates" },
]
keywords = ["vaid", "a2a", "agent-identity", "delegation", "attenuation", "agent2agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
# vaid-mint supplies verification, chain-attenuation and revocation primitives
# (vaid_mint.verify, vaid_mint.chain, vaid_mint.document, vaid_mint.revocation) —
# this package is a thin extraction-and-ordering layer over them, not a second
# implementation. No dependency on a2a-python or any A2A SDK: Message is accepted
# as a plain dict so this works against any A2A server or client, per the brief.
dependencies = [
    "vaid-mint>=0.10.0,<0.11",
]

[project.scripts]
# The packaged firewall: an external consumer who installed ONLY the wheel can run
# `vaid-a2a-conformance` to prove the verifier they got reaches the verdict
# docs/a2a/v1/extension.md specifies for every published extension vector. It pins
# VERDICTS, not bytes - see the module docstring on why that is the normative
# surface for a verifier, and why it is a different claim rather than a weaker one.
vaid-a2a-conformance = "vaid_a2a.conformance:main"

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[project.urls]
Homepage = "https://github.com/solara-associates/vaid"
Repository = "https://github.com/solara-associates/vaid"
Source = "https://github.com/solara-associates/vaid/tree/main/python/vaid-a2a"
Issues = "https://github.com/solara-associates/vaid/issues"

[tool.hatch.build.targets.wheel]
# The extension vectors ship inside the wheel (vaid_a2a/vectors/, vendored
# byte-identically from docs/a2a/v1/vectors/ and cmp-checked in CI) so a
# consumer's firewall runs against the exact bytes this verifier was proven
# against - the same reason vaid_pop and vaid_mint bundle theirs.
packages = ["vaid_a2a"]

[tool.hatch.build.targets.sdist]
include = ["vaid_a2a", "tests", "examples", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
